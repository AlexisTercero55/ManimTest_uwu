[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Alexistercero's manim experiments"
version = "0.1.0"
description = "Manim Community Edition scenes and shader experiments"
requires-python = ">=3.13"
dependencies = [
    "manim==0.21.0",
    "numpy==2.2.4",
]

[tool.setuptools]
packages = ["manim_helpers"]
